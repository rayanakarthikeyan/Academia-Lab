<!doctype html>
<meta charset="utf-8" />
<!-- Opaque origin + no network: even Java-to-JavaScript escapes cannot access the portal. -->
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob:; worker-src blob:; child-src blob:; connect-src 'none'"
/>
<title>Isolated Java lab runtime</title>
<script>
  let worker;
  const urls = [];
  const cleanup = () => {
    worker?.terminate();
    urls.forEach((url) => URL.revokeObjectURL(url));
  };
  addEventListener("message", (event) => {
    if (event.source !== parent) return;
    if (event.data?.type === "cancel") {
      cleanup();
      return;
    }
    if (event.data?.type === "debug-resume") {
      worker?.postMessage({ debugResume: true });
      return;
    }
    if (event.data?.type !== "run" || worker) return;
    try {
      const { assets, code, stdin, files, debug } = event.data;
      const blobUrl = (text) => {
        const url = URL.createObjectURL(
          new Blob([text], { type: "text/javascript" }),
        );
        urls.push(url);
        return url;
      };
      const libraries = [blobUrl(assets.browserfs), blobUrl(assets.doppio)];
      worker = new Worker(
        blobUrl(
          `importScripts(${libraries.map((url) => JSON.stringify(url)).join(",")});\n${assets.worker}`,
        ),
      );
      worker.onmessage = (message) => {
        parent.postMessage({ type: "kgr-java", ...message.data }, "*");
        if (message.data.result) cleanup();
      };
      worker.onerror = (event) => {
        parent.postMessage(
          {
            type: "kgr-java",
            error:
              "Java runtime error: " +
              (event.message || "Unable to start in this browser."),
          },
          "*",
        );
        cleanup();
      };
      worker.postMessage(
        {
          code,
          stdin,
          files,
          debug,
          runtime: assets.runtime,
          compiler: assets.compiler,
          jdbc: assets.jdbc,
        },
        [assets.runtime, assets.compiler, assets.jdbc],
      );
    } catch (error) {
      parent.postMessage({ type: "kgr-java", error: String(error) }, "*");
      cleanup();
    }
  });
  parent.postMessage({ type: "kgr-java-ready" }, "*");
</script>
